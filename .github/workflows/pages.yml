name: Pages – prod & PR preview

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ false }} # временно отключено
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          ls -la
          test -f index.html || (echo "index.html НЕ найден в корне репозитория" && exit 1)
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-prod:
    if: ${{ false }} # временно отключено
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  deploy-preview:
    if: ${{ false }} # временно отключено
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          preview: true